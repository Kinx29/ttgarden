<!DOCTYPE html>
<html>
<head>
    <title>Book TT Garden</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #f8f9fa;
        }

        .navbar {
            background: #0f3d2e;
            padding: 15px;
            text-align: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: 500;
        }

        .container {
            max-width: 500px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #0f3d2e;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-family: 'Poppins', sans-serif;
        }

        button {
            background: #0f3d2e;
            color: white;
            padding: 14px;
            width: 100%;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #145c44;
        }

        .note {
            margin-top: 20px;
            font-size: 13px;
            color: #555;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

    </style>
</head>

<body>

<div class="navbar">
    <a href="index.html">Home</a>
    <a href="venue.html">Venue</a>
    <a href="rentals.html">Rentals</a>
    <a href="gallery.html">Gallery</a>
    <a href="booking.html">Booking</a>
</div>

<div class="container">

    <h2>Reserve Your Event</h2>

    <div class="success" id="successMessage">
        ✅ Booking request submitted successfully! We will contact you soon.
    </div>

    <form onsubmit="return validateForm()">

        <input type="text" placeholder="Full Name" required>

        <input type="tel" placeholder="Phone Number" required>

        <input type="email" placeholder="Email Address" required>

        <select required>
            <option value="">Select Event Type</option>
            <option>Wedding</option>
            <option>Birthday</option>
            <option>Reception</option>
            <option>Corporate Event</option>
            <option>Other</option>
        </select>

        <input type="number" placeholder="Number of Guests" required>

        <input type="date" id="eventDate" required>

        <textarea placeholder="Special Requests (Optional)" rows="3"></textarea>

        <button type="submit">Submit Booking Request</button>

    </form>

    <div class="note">
        ⚠ Booking is confirmed only after advance payment.  
        ⚠ Date will be blocked after confirmation call.
    </div>

</div>

<script>
function validateForm() {
    let selectedDate = new Date(document.getElementById("eventDate").value);
    let today = new Date();
    today.setHours(0,0,0,0);

    if (selectedDate <= today) {
        alert("Same-day or past bookings are not allowed.");
        return false;
    }

    document.getElementById("successMessage").style.display = "block";
    return false; // prevents actual form submission (for now)
}
</script>

</body>
</html>
