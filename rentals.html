<!DOCTYPE html>
<html>
<head>
    <title>TT Garden - Rentals</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Dark Header */
        .hero {
            background: #0f3d2e;
            color: white;
            padding: 70px 20px;
            text-align: center;
        }

        .hero h1 {
            margin: 0;
            font-size: 40px;
        }

        .hero p {
            margin-top: 10px;
            font-size: 18px;
        }

        /* Light Section */
        .section-light {
            background: #f8f9fa;
            padding: 60px 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            text-align: center;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            color: #0f3d2e;
            margin-bottom: 10px;
        }

        footer {
            background: #0f3d2e;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>
<div style="background:#0f3d2e; padding:15px; text-align:center;">
    <a href="index.html" style="color:white; margin:15px; text-decoration:none;">Home</a>
    <a href="rentals.html" style="color:white; margin:15px; text-decoration:none;">Rentals</a>
    <a href="booking.html" style="color:white; margin:15px; text-decoration:none;">Booking</a>
    <a href="gallery.html" style="color:white; margin:15px; text-decoration:none;">Gallery</a>
</div>

    <!-- Dark Hero Section -->
    <div class="hero">
        <h1>Rental Items</h1>
        <p>Available at TT Garden</p>
    </div>

    <!-- Rentals Section -->
    <div class="section-light">
        <div class="container">
            <div class="grid">

                <div class="card">
                    <h3>Plastic Chairs</h3>
                    <p>400 Available</p>
                </div>

                <div class="card">
                    <h3>Round Tables</h3>
                    <p>10 Available</p>
                </div>

                <div class="card">
                    <h3>Rectangle Tables</h3>
                    <p>10 Available</p>
                </div>

                <div class="card">
                    <h3>Canopy</h3>
                    <p>4 Available</p>
                </div>

                <div class="card">
                    <h3>Gas Stove</h3>
                    <p>2 Available</p>
                </div>

                <div class="card">
                    <h3>Generator (15 KVA)</h3>
                    <p>1 Available</p>
                </div>

            </div>
        </div>
    </div>

    <footer>
        📞 7005582449 | 7005711500  
        <br>
        © 2026 TT Garden
    </footer>

</body>
</html>
