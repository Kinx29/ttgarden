<!DOCTYPE html>
<html>
<head>
    <title>TT Garden - Gallery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .hero {
            background: #0f3d2e;
            color: white;
            padding: 70px 20px;
            text-align: center;
        }

        .section-light {
            background: #f8f9fa;
            padding: 60px 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .gallery-item img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .caption {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            color: #0f3d2e;
        }

        footer {
            background: #0f3d2e;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>
<div style="background:#0f3d2e; padding:15px; text-align:center;">
    <a href="index.html" style="color:white; margin:15px; text-decoration:none;">Home</a>
    <a href="rentals.html" style="color:white; margin:15px; text-decoration:none;">Rentals</a>
    <a href="booking.html" style="color:white; margin:15px; text-decoration:none;">Booking</a>
    <a href="gallery.html" style="color:white; margin:15px; text-decoration:none;">Gallery</a>
</div>

    <div class="hero">
        <h1>Previous Events</h1>
        <p>Moments Celebrated at TT Garden</p>
    </div>

    <div class="section-light">
        <div class="container">
            <div class="grid">

                <div class="gallery-item">
                    <img src="event1.jpg" alt="Event 1">
                    <div class="caption">Wedding Ceremony</div>
                </div>

                <div class="gallery-item">
                    <img src="event2.jpg" alt="Event 2">
                    <div class="caption">Birthday Celebration</div>
                </div>

                <div class="gallery-item">
                    <img src="event3.jpg" alt="Event 3">
                    <div class="caption">Reception Night</div>
                </div>

                <div class="gallery-item">
                    <img src="event4.jpg" alt="Event 4">
                    <div class="caption">Community Event</div>
                </div>

            </div>
        </div>
    </div>

    <footer>
        📞 7005582449 | 7005711500  
        <br>
        © 2026 TT Garden
    </footer>

</body>
</html>
